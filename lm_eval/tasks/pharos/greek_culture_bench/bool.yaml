task: greek_culture_bench_bool
dataset_path: ilsp/greek_culture_bench
test_split: train
process_docs: !function utils.process_bool
dataset_kwargs: {}
output_type: generate_until
doc_to_text: !function utils.doc_to_text_dynamic
doc_to_target: !function utils.doc_to_target_closed
process_results: !function utils.process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - "<|end_of_text|>"
    - "\n\n"
  max_gen_toks: 16
  temperature: 0.0
