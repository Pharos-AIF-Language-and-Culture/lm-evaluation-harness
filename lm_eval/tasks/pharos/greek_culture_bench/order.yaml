task: greek_culture_bench_order
dataset_path: ilsp/greek_culture_bench
test_split: train
process_docs: !function utils.process_order
dataset_kwargs: {}
output_type: generate_until
doc_to_text: !function utils.doc_to_text_dynamic
doc_to_target: "{{Verification}}"
process_results: !function utils.process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: partial_credit
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - "<|end_of_text|>"
  max_gen_toks: 128
  temperature: 0.0
