# Greek History Chronological Order QA
#
# Reference: https://huggingface.co/datasets/ilsp/greek-history-trapeza-thematon-co-qa
#
# Description:
# A structured QA dataset containing questions about historical events, where the task
# is to determine the correct chronological order of the presented events.
#

task: greek_history_co_qa
dataset_path: ilsp/greek-history-trapeza-thematon-co-qa
test_split: test
fewshot_split: dev
num_fewshot: 5
output_type: generate_until
doc_to_text: !function utils.doc_to_text
doc_to_target: !function utils.doc_to_target
process_results: !function utils.process_results
generation_kwargs:
  max_gen_toks: 32
  until:
    - "\n\n"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: kendalls_tau
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  task_type: generative
  language: Greek
  author: ATHENA/ILSP
