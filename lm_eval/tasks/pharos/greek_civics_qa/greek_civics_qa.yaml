task: greek_civics_qa
dataset_path: ilsp/greek_civics_qa
dataset_name: default
output_type: generate_until
training_split: null
validation_split: default
test_split: null
num_fewshot: 0
doc_to_text: "\
  {% set prompt_qa = 'Απάντησε στην παρακάτω ερώτηση που σχετίζεται με το μάθημα της κοινωνικής και πολιτικής αγωγής.\n\n' %}\
  {{ prompt_qa ~ '\n\nΕρώτηση: ' ~ question ~ '\n\nΑπάντηση:\n' }}"
doc_to_target: answer
process_results: !function utils.process_results_gen
should_decontaminate: True
doc_to_decontamination_query: question
generation_kwargs:
  max_gen_toks: 300
  until:
    - "\n\n"
metric_list:
  - metric: bleu_max
    aggregation: mean
    higher_is_better: true
  - metric: rouge1_max
    aggregation: mean
    higher_is_better: true
  - metric: rouge2_max
    aggregation: mean
    higher_is_better: true
  - metric: rougeL_max
    aggregation: mean
    higher_is_better: true
  - metric: bertscore_f1_max
    aggregation: mean
    higher_is_better: true
metadata:
  version: 3.0
