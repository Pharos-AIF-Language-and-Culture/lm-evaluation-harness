tag:
  - llama
task: arc_el_challenge_chat
dataset_path: ilsp/arc_greek
dataset_name: ARC-Challenge
output_type: generate_until
training_split: train
validation_split: validation
test_split: test
fewshot_split: train
doc_to_text: 'Βάση της ακόλουθης ερώτησης και των δοσμένων πιθανών απαντήσεων (A, B, C and D), επίλεξε την σωστή απάντηση.\nΕρώτηση: {{question.strip()}}\nA. {{choices.text[0]}}\nB. {{choices.text[1]}}\nC. {{choices.text[2]}}{% if choices.text|length > 3 %}\nD. {{choices.text[3]}}{% endif %}\nΗ απάντηση σου πρέπει να τελειώνει με: "Η σωστή απάντηση είναι η [το_γράμμα_της_απάντησης]" όπου [το_γράμμα_της_απάντησης] είναι ένα εκ των A, B, C ή D.'
gen_prefix: 'Η καλύτερη απάντηση είναι'
fewshot_delimiter: "\n\n"
doc_to_target: "{{ 'ABCD'[answerKey|int - 1] if answerKey|string in '1234' else answerKey }}"
num_fewshot: 0
generation_kwargs:
  max_gen_toks: 100
  until:
    - "\n\n"
    - "."
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
filter_list:
  - name: remove_whitespace
    filter:
      - function: remove_whitespace
      - function: take_first
metadata:
  version: 1.0
