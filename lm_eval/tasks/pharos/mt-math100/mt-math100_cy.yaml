# MT-MATH100 - Welsh
# Multilingual MATH problems (Hugging Face)

task: mt-math100_cy
custom_dataset: !function utils.load_dataset
dataset_kwargs:
  dataset_path: amphora/MCLM
  dataset_name: MT-MATH100
  language_column: cy
output_type: generate_until
test_split: test
fewshot_split: null
num_fewshot: 0

doc_to_text: "Question: {{question}}\nAnswer:"
doc_to_target: "{{answer}}"

process_results: !function utils.process_results

generation_kwargs:
  until:
    - "\n\n"
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 512

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true

metadata:
  version: 1.0
  language: cy
  language_name: Welsh
  description: "Multilingual MATH problems in Welsh (MT-MATH100)"
  evaluation_method: "rule-based verifier"
